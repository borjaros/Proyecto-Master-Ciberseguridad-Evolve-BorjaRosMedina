<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Jerarquía PKI BERMA</title>
  <desc>Diagrama de la jerarquía de confianza PKI de BERMA: CA Raíz, CA Intermedia y certificados finales</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CA Raiz -->
  <g class="c-purple">
    <rect x="190" y="20" width="300" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">BERMA Root CA</text>
    <text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">RSA 4096 · SHA-256 · Válida 10 años</text>
    <text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">🔒 OFFLINE — clave cifrada con AES-256</text>
  </g>

  <!-- Flecha raiz -> intermedia -->
  <line x1="340" y1="100" x2="340" y2="148" stroke="var(--color-border-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="358" y="128" dominant-baseline="central">firma</text>

  <!-- CA Intermedia -->
  <g class="c-teal">
    <rect x="160" y="150" width="360" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="180" text-anchor="middle" dominant-baseline="central">BERMA Intermediate CA</text>
    <text class="ts" x="340" y="200" text-anchor="middle" dominant-baseline="central">RSA 2048 · SHA-256 · Válida 5 años · pathlen:0</text>
    <text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">CRL: http://192.168.100.10/crl/intermediate.crl</text>
  </g>

  <!-- Flechas intermedia -> certificados finales -->
  <line x1="260" y1="240" x2="160" y2="298" stroke="var(--color-border-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="240" x2="340" y2="298" stroke="var(--color-border-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="240" x2="530" y2="298" stroke="var(--color-border-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cert servidor -->
  <g class="c-blue">
    <rect x="50" y="300" width="210" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="155" y="326" text-anchor="middle" dominant-baseline="central">berma-ca.local</text>
    <text class="ts" x="155" y="346" text-anchor="middle" dominant-baseline="central">Certificado servidor</text>
    <text class="ts" x="155" y="362" text-anchor="middle" dominant-baseline="central">serverAuth · RSA 2048 · 375 días</text>
  </g>

  <!-- Cert cliente tecnico01 -->
  <g class="c-coral">
    <rect x="230" y="300" width="220" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="326" text-anchor="middle" dominant-baseline="central">tecnico01@berma.local</text>
    <text class="ts" x="340" y="346" text-anchor="middle" dominant-baseline="central">Certificado cliente</text>
    <text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">clientAuth · RSA 2048 · 375 días</text>
  </g>

  <!-- Cert adicionales via script -->
  <g class="c-gray">
    <rect x="420" y="300" width="220" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="530" y="326" text-anchor="middle" dominant-baseline="central">Certificados adicionales</text>
    <text class="ts" x="530" y="346" text-anchor="middle" dominant-baseline="central">Emitidos via pki_manager.py</text>
    <text class="ts" x="530" y="362" text-anchor="middle" dominant-baseline="central">serverAuth / clientAuth</text>
  </g>

  <!-- CRL box -->
  <g class="c-amber">
    <rect x="200" y="430" width="280" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="453" text-anchor="middle" dominant-baseline="central">CRL publicada vía Apache2</text>
    <text class="ts" x="340" y="473" text-anchor="middle" dominant-baseline="central">http://192.168.100.10/crl/intermediate.crl</text>
  </g>

  <!-- Flecha intermedia -> CRL -->
  <line x1="340" y1="380" x2="340" y2="428" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="358" y="408" dominant-baseline="central">publica</text>

</svg>
